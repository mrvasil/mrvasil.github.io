<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#090909">
    <meta name="description" content="Alexey V. — @mrvasil. Telegram, email and GitHub.">
    <meta property="og:title" content="mrvasil">
    <meta property="og:description" content="Alexey V. — direct contacts.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/avatar.jpg">

    <title>mrvasil</title>

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <a class="skip-link" href="#contacts">Skip to contacts</a>

    <div class="atmosphere" aria-hidden="true">
      <div class="grid"></div>
      <div class="gift-layer" id="gift-layer"></div>
    </div>

    <div class="shell">
      <header class="masthead">
        <a class="profile" href="https://t.me/mrvasil" target="_blank" rel="noreferrer" aria-label="Open Alexey V. on Telegram">
          <img src="assets/avatar.jpg" width="44" height="44" alt="Alexey V.">
          <span class="profile-copy">
            <strong>Alexey V.</strong>
            <span>@mrvasil</span>
          </span>
        </a>

        <nav class="teams" aria-label="Teams">
          <a class="team-link team-zagip" href="https://zagip.ru" target="_blank" rel="noreferrer">
            <span class="team-emblem" aria-hidden="true">
              <svg viewBox="0 0 44 44">
                <path class="portrait-head" d="M12 17.5C12 8.8 16 4 22 4s10 4.8 10 13.5l-.6 7.4C30.8 31.8 27.2 36 22 36s-8.8-4.2-9.4-11.1z"></path>
                <path class="portrait-hair" d="M12.3 17.2C11.7 8.7 16 3.6 22.3 3.6c5.7 0 9.3 3.6 10 10.2-2.8-2.5-6.1-3.2-9.3-2.4-3 .7-5.4 2.5-7.2 5.3"></path>
                <path class="portrait-face" d="M16 20.8c1.5-1 3-1 4.4-.1m3.3 0c1.4-.9 2.9-.9 4.3.1M18.2 28.3c2.5 1.8 5.1 1.8 7.7 0"></path>
                <path class="portrait-beard" d="M12.7 24.8c1 7.4 4.2 11.5 9.3 11.5s8.3-4.1 9.3-11.5c-1.9 4.8-5 7.1-9.3 7.1s-7.4-2.3-9.3-7.1z"></path>
                <path class="portrait-suit" d="M7.5 43c.8-4.7 4.5-7.3 9.5-8.5l5 5 5-5c5 1.2 8.7 3.8 9.5 8.5"></path>
              </svg>
            </span>
            <span class="team-name">zagip</span>
            <span class="team-arrow" aria-hidden="true">↗</span>
          </a>
          <a class="team-link team-daywave" href="https://daywave.ru" target="_blank" rel="noreferrer">
            <span class="team-emblem" aria-hidden="true">
              <svg viewBox="0 0 44 44">
                <path class="wave-a" d="M3 24c5 0 5-11 10-11s5 11 10 11 5-11 10-11 5 11 10 11"></path>
                <path class="wave-b" d="M3 29c5 0 5-11 10-11s5 11 10 11 5-11 10-11 5 11 10 11"></path>
              </svg>
            </span>
            <span class="team-name">daywave</span>
            <span class="team-arrow" aria-hidden="true">↗</span>
          </a>
        </nav>
      </header>

      <main class="hero">
        <h1 class="sr-only">@mrvasil</h1>
        <div class="hero-copy" data-word="@mrvasil" aria-hidden="true">
          <div class="hero-title"><span class="at">@</span><span class="handle-text" id="handle-text">mrvasil</span></div>
        </div>
      </main>

      <nav class="contacts" id="contacts" aria-label="Contacts">
        <a href="https://t.me/mrvasil" target="_blank" rel="noreferrer">
          <span class="contact-code">TG</span>
          <span class="contact-main">
            <span class="contact-label">Telegram</span>
            <span class="contact-value">@mrvasil</span>
          </span>
          <span class="contact-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"></path></svg>
          </span>
          <span class="contact-ghost" aria-hidden="true">TG</span>
        </a>

        <a href="mailto:mrvasil@mrvasil.ru">
          <span class="contact-code">MAIL</span>
          <span class="contact-main">
            <span class="contact-label">Email</span>
            <span class="contact-value">mrvasil@mrvasil.ru</span>
          </span>
          <span class="contact-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"></path></svg>
          </span>
          <span class="contact-ghost" aria-hidden="true">MAIL</span>
        </a>

        <a href="https://github.com/mrvasil" target="_blank" rel="noreferrer">
          <span class="contact-code">GIT</span>
          <span class="contact-main">
            <span class="contact-label">GitHub</span>
            <span class="contact-value">/mrvasil</span>
          </span>
          <span class="contact-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"></path></svg>
          </span>
          <span class="contact-ghost" aria-hidden="true">GIT</span>
        </a>
      </nav>
    </div>

    <script src="script.js"></script>
  </body>
</html>
